services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: resume_review_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d resume_review_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@postgres:5432/resume_review_test
      REDIS_URL: redis://redis:6379/0
      APP_ENV: test
      ALLOW_TEST_ADAPTERS: "true"
      DEBUG: "false"
      SECRET_KEY: test-secret-key-for-e2e-integration-testing-only-safe
      ADMIN_PASSWORD: test-admin-secret
      STORAGE_DIR: /tmp/resume_storage
      REFERENCE_CATALOG_PATH: /app/reference_catalog.json
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    command: python -m app.jobs.worker
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 100
    tmpfs:
      - /tmp/git_workspaces:size=512M,mode=1777
    environment:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@postgres:5432/resume_review_test
      REDIS_URL: redis://redis:6379/0
      APP_ENV: test
      ALLOW_TEST_ADAPTERS: "true"
      DEBUG: "false"
      SECRET_KEY: test-secret-key-for-e2e-integration-testing-only-safe
      ADMIN_PASSWORD: test-admin-secret
      STORAGE_DIR: /tmp/resume_storage
      REFERENCE_CATALOG_PATH: /app/reference_catalog.json
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://api:8000
      PORT: "3000"
      NODE_ENV: test
      ADMIN_PASSWORD: test-admin-secret
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 4s
      timeout: 3s
      retries: 15
